services:
  rpi-serv:
    build: .
    container_name: drace_serv
    network_mode: host      # acces direct aux interfaces wifi de l'hote, pas de NAT
    privileged: true        # requis pour autoriser l'ecriture sysfs (/sys/class/pwm) et l'acces aux GPIO
    cap_add:
      - NET_ADMIN           # requis pour "ip addr" et hostapd
    devices:
      - /dev/gpiochip0:/dev/gpiochip0
    volumes:
      - /sys:/sys
      - /usr/bin/pinctrl:/usr/bin/pinctrl:ro
    restart: unless-stopped
    environment:
      AP_IFACE: ${AP_IFACE:-wlx340a33315eaa}   # antenne USB, surchargable : AP_IFACE=... docker compose up -d
      AP_SSID: drace_wifi
      AP_PASS: drace_wifi         # 8 caracteres minimum
      AP_IP: 192.168.4.1
      AP_DHCP_START: 192.168.4.10
      AP_DHCP_END: 192.168.4.100
      AP_CHANNEL: "1"